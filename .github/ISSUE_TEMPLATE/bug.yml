name: Bug report
description: Report reproducible unexpected behavior.
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description:
        Include app version, Android version, and network state if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance criteria for a fix
      description: Include a regression scenario where possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description:
        Never attach tokens, invite codes, private media, or partner data.
